  - id: refresh_normal_light_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          auto detail_slot = id(app_storage)->normal_device_slot(detail_index);
          auto light_state = detail_slot.light();
          bool is_on = light_state.is_on;
          int brightness = (int) light_state.brightness_pct;
          if (brightness < 0) brightness = 0;
          if (brightness > 100) brightness = 100;
          const int displayed_brightness = is_on ? brightness : 0;
          int last_nonzero = (int) light_state.last_nonzero_brightness_pct;
          if (last_nonzero < 1 || last_nonzero > 100) last_nonzero = 100;
          const bool brightness_capable = light_state.custom_supports_brightness();
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT && brightness_capable) {
            if (is_on && brightness <= 0) {
              brightness = last_nonzero;
              if (brightness < 1 || brightness > 100) brightness = 100;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(brightness);
              detail_slot.update_light(patch);
            }
            if (brightness > 0) {
              last_nonzero = brightness;
              esphome::onx_storage::NormalLightStatePatch patch{};
              patch.has_brightness_pct = true;
              patch.brightness_pct = static_cast<uint8_t>(last_nonzero);
              detail_slot.update_light(patch);
            }
          }
          id(normal_device_detail_light_brightness) = displayed_brightness;
          id(normal_device_detail_light_last_nonzero_brightness) = last_nonzero;
          id(normal_device_detail_is_on) = is_on;
          std::string state_text = is_on ? "ON" : "OFF";
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT && brightness_capable) {
            state_text = is_on ? (std::to_string(displayed_brightness) + "%") : "OFF";
          }

          lv_obj_t *page = id(normal_light_page)->obj;
          lv_obj_t *shell = id(normal_light_detail_shell);
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          if (is_on) {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_light_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_light_detail_title), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x272727), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x272727), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_light_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_light_detail_title), lv_color_hex(0xD2D2D2), 0);
          }

          set_hidden(id(normal_light_device_detail_switch_on), true);
          set_hidden(id(normal_light_device_detail_switch_off), true);
          set_hidden(id(normal_light_device_detail_plug_on), true);
          set_hidden(id(normal_light_device_detail_plug_off), true);
          set_hidden(id(normal_light_device_detail_light_on), !is_on);
          set_hidden(id(normal_light_device_detail_light_off), is_on);

          lv_label_set_text(id(normal_light_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_light_detail_title), device_title.c_str());
          const bool is_light = id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_LIGHT;
          auto is_mode_enabled = [&](int mode) -> bool {
            if (mode == 0) {
              return light_state.custom_supports_brightness();
            }
            if (mode == 1) {
              return light_state.custom_supports_color_temperature();
            }
            if (mode == 2) {
              return light_state.custom_supports_rgb();
            }
            return false;
          };
          const bool mode_0_enabled = is_mode_enabled(0);
          const bool mode_1_enabled = is_mode_enabled(1);
          const bool mode_2_enabled = is_mode_enabled(2);
          int mode_count = 0;
          for (int i = 0; i < 3; ++i) {
            if (is_mode_enabled(i)) {
              mode_count++;
            }
          }
          id(normal_detail_light_mode_count) = mode_count;
          const bool has_adjustable_mode = mode_count > 0;
          const bool mode_switching = is_light && has_adjustable_mode && !id(normal_clear_wifi_allowed);
          auto set_mode_shell_layout = [&]() {
            if (mode_switching) {
              lv_obj_set_pos(id(normal_light_detail_mode_text_shell), 0, 165);
              lv_obj_set_size(id(normal_light_detail_mode_text_shell), 90, 26);
            } else {
              lv_obj_set_pos(id(normal_light_detail_mode_text_shell), 0, 166);
              lv_obj_set_size(id(normal_light_detail_mode_text_shell), 90, 23);
            }
          };
          auto set_mode_icon_visual = [&](lv_obj_t *icon, lv_obj_t *img, bool active) {
            const int size = mode_switching ? (active ? 26 : 23) : 20;
            const uint16_t zoom = mode_switching ? (active ? 333 : 295) : 256;
            lv_obj_set_size(icon, size, size);
            lv_obj_set_style_radius(icon, size / 2, 0);
            lv_img_set_zoom(img, zoom);
            lv_img_set_pivot(img, 10, 10);
            lv_img_set_antialias(img, true);
            lv_obj_set_style_border_width(icon, active ? 3 : 0, 0);
            lv_obj_set_style_border_color(icon, lv_color_hex(0xFFFFFF), 0);
          };
          if (!is_mode_enabled(id(normal_detail_light_mode))) {
            for (int mode = 0; mode < 3; ++mode) {
              if (is_mode_enabled(mode)) {
                id(normal_detail_light_mode) = mode;
                break;
              }
            }
          }
          set_mode_shell_layout();
          set_hidden(id(normal_light_detail_mode_text_shell), !is_light || !has_adjustable_mode);
          set_hidden(id(normal_light_detail_mode_icon_brightness), !is_light || !mode_0_enabled);
          set_hidden(id(normal_light_detail_mode_icon_cct), !is_light || !mode_1_enabled);
          set_hidden(id(normal_light_detail_mode_icon_color), !is_light || !mode_2_enabled);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_brightness), id(normal_light_detail_mode_icon_brightness_img),
                               is_light && mode_0_enabled && id(normal_detail_light_mode) == 0);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_cct), id(normal_light_detail_mode_icon_cct_img),
                               is_light && mode_1_enabled && id(normal_detail_light_mode) == 1);
          set_mode_icon_visual(id(normal_light_detail_mode_icon_color), id(normal_light_detail_mode_icon_color_img),
                               is_light && mode_2_enabled && id(normal_detail_light_mode) == 2);

          const bool show_cct_bar = is_light && mode_1_enabled && id(normal_detail_light_mode) == 1;
          const bool show_rgb_bar = is_light && mode_2_enabled && id(normal_detail_light_mode) == 2;
          set_hidden(id(normal_light_dimming_light_detail_arc),
                     !is_light || !mode_0_enabled || id(normal_detail_light_mode) != 0);
          if (is_light && mode_0_enabled) {
            lv_arc_set_value(id(normal_light_dimming_light_detail_arc), std::clamp(displayed_brightness, 0, 100));
          }
          lv_obj_t *sw = id(hmi_gui_switch);
          if (is_on) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          const bool is_online = (detail_index >= 0 && detail_index < 10)
                                     ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                     : true;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online;
          set_hidden(id(normal_light_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_light_detail_offline_text), offline_text);

          set_hidden(id(normal_light_cct_gradient), !show_cct_bar);
          set_hidden(id(normal_light_rgb_gradient), !show_rgb_bar);
          set_hidden(id(normal_light_cct_value_arc), !show_cct_bar);
          set_hidden(id(normal_light_rgb_value_arc), !show_rgb_bar);
          lv_obj_set_style_img_opa(id(normal_light_cct_gradient), is_on ? LV_OPA_COVER : LV_OPA_40, 0);
          lv_obj_set_style_img_opa(id(normal_light_rgb_gradient), is_on ? LV_OPA_COVER : LV_OPA_40, 0);
          if (show_cct_bar) {
            int value_pct = std::clamp<int>(detail_slot.light().color_temperature_step(), 0, 10);
            id(normal_light_cct_value_pct) = value_pct;
            lv_arc_set_value(id(normal_light_cct_value_arc), value_pct);
          }
          if (show_rgb_bar) {
            int value_pct = (int) detail_slot.light().rgb_tick;
            value_pct = std::clamp(value_pct, 0, 35);
            id(normal_light_rgb_value_pct) = value_pct;
            lv_arc_set_value(id(normal_light_rgb_value_arc), value_pct);
          }

  - id: update_normal_detail_exit_ready_flags
    mode: restart
    then:
      - lambda: |-
          const uint32_t held_ms = millis() - id(key_press_started_ms);
          const int kind = id(normal_device_detail_kind);
          if (kind == NORMAL_DEVICE_DETAIL_KIND_SWITCH || kind == NORMAL_DEVICE_DETAIL_KIND_PLUG || kind == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            id(normal_detail_exit_switch_ready) = held_ms >= 688;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            id(normal_detail_exit_switch_ready) = held_ms >= 688;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= 688;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = held_ms >= 688;
            id(normal_detail_exit_settings_ready) = false;
          } else if (kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL || kind == NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL_QR_CODE) {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = held_ms >= 688;
          } else {
            id(normal_detail_exit_switch_ready) = false;
            id(normal_detail_exit_light_ready) = false;
            id(normal_detail_exit_settings_ready) = false;
          }

  - id: can_exit_normal_detail
    mode: restart
    then:
      - lambda: |-
          if (!id(normal_device_detail_active)) {
            id(normal_detail_exit_allowed) = false;
            return;
          }
          switch (id(normal_device_detail_kind)) {
            case NORMAL_DEVICE_DETAIL_KIND_SWITCH:
            case NORMAL_DEVICE_DETAIL_KIND_PLUG:
            case NORMAL_DEVICE_DETAIL_KIND_CURTAIN:
            case NORMAL_DEVICE_DETAIL_KIND_AUTOMATION:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_switch_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_DIMMING_LIGHT:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_light_ready);
              break;
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_WIFI:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_BRIGHTNESS:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_KNOB:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL:
            case NORMAL_DEVICE_DETAIL_KIND_SETTINGS_USER_MANUAL_QR_CODE:
              id(normal_detail_exit_allowed) = id(normal_detail_exit_settings_ready);
              break;
            default:
              id(normal_detail_exit_allowed) = false;
              break;
          }

  - id: refresh_normal_curtain_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_CURTAIN) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          if (!id(normal_device_detail_curtain_adjust_active)) {
            const int storage_position = std::clamp((int) id(app_storage)->get_normal_ui_device_position(detail_index), 0, 100);
            id(normal_device_detail_curtain_feedback_position) = storage_position;
            id(normal_device_detail_curtain_target_position) = storage_position;
          }

          int display_position = id(normal_device_detail_curtain_feedback_position);
          display_position = std::clamp(display_position, 0, 100);

          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          lv_obj_t *page = id(normal_curtain_page)->obj;
          lv_obj_t *shell = id(normal_curtain_detail_shell);
          lv_obj_t *arc = id(normal_curtain_detail_arc);
          lv_obj_t *target_arc = id(normal_curtain_detail_target_arc);
          lv_obj_set_style_bg_color(page, lv_color_hex(0x000000), 0);
          lv_obj_set_style_bg_color(shell, lv_color_hex(0x232323), 0);
          lv_obj_set_style_border_width(shell, 0, 0);
          lv_arc_set_value(arc, display_position);
          const int target_position = std::clamp(id(normal_device_detail_curtain_target_position), 0, 100);
          lv_arc_set_value(target_arc, target_position);
          set_hidden(id(normal_curtain_detail_target_arc), !id(normal_device_detail_curtain_adjust_active));

          set_hidden(id(normal_curtain_detail_0_img), true);
          set_hidden(id(normal_curtain_detail_100_img), true);
          set_hidden(id(normal_curtain_detail_x_img), true);
          if (display_position <= 0) {
            set_hidden(id(normal_curtain_detail_0_img), false);
          } else if (display_position >= 100) {
            set_hidden(id(normal_curtain_detail_100_img), false);
          } else {
            set_hidden(id(normal_curtain_detail_x_img), false);
          }

          set_hidden(id(normal_curtain_detail_opening_on), true);
          set_hidden(id(normal_curtain_detail_opening_off), false);
          set_hidden(id(normal_curtain_detail_pause_on), true);
          set_hidden(id(normal_curtain_detail_pause_off), false);
          set_hidden(id(normal_curtain_detail_closing_on), true);
          set_hidden(id(normal_curtain_detail_closing_off), false);

          std::string state_text = std::to_string(display_position) + "%";
          const uint32_t curtain_state_code = id(app_storage)->get_normal_ui_device_extra_u32(detail_index, 2);
          if (curtain_state_code == 3) {
            state_text = "Opening";
            set_hidden(id(normal_curtain_detail_opening_on), false);
            set_hidden(id(normal_curtain_detail_opening_off), true);
            set_hidden(id(normal_curtain_detail_pause_on), true);
            set_hidden(id(normal_curtain_detail_pause_off), false);
          } else if (curtain_state_code == 4) {
            state_text = "Closing";
            set_hidden(id(normal_curtain_detail_closing_on), false);
            set_hidden(id(normal_curtain_detail_closing_off), true);
            set_hidden(id(normal_curtain_detail_pause_on), true);
            set_hidden(id(normal_curtain_detail_pause_off), false);
          } else {
            set_hidden(id(normal_curtain_detail_pause_on), false);
            set_hidden(id(normal_curtain_detail_pause_off), true);
          }
          if (display_position >= 100) {
            state_text = "Open";
          } else if (display_position <= 0) {
            state_text = "Closed";
          }
          if (id(normal_device_detail_curtain_adjust_active) || 
          (curtain_state_code == 3 || curtain_state_code == 4)) {
            state_text += " -> " + std::to_string(target_position) + "%";
          }

          lv_label_set_text(id(normal_curtain_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_curtain_detail_title), device_title.c_str());
          const bool is_online = (detail_index >= 0 && detail_index < 10)
                                     ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                     : true;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online;
          set_hidden(id(normal_curtain_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_curtain_detail_offline_text), offline_text);


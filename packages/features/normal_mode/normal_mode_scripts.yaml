          if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected()) {
            char ssid_buf[wifi::SSID_BUFFER_SIZE] = {0};
            std::span<char, wifi::SSID_BUFFER_SIZE> ssid_span(ssid_buf);
            const char *ssid_cstr = wifi::global_wifi_component->wifi_ssid_to(ssid_span);

  - id: emit_normal_switch_control_event
    mode: restart
    then:
      - lambda: |-
          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          std::string device_title = id(ui_presenter)->get_normal_device_title(detail_index);
          if (device_title.empty()) {
            device_title = "switch";
          }

          ESP_LOGI("normal_mode",
                   "switch/plug/light detail pressed: index=%d kind=%d entity_id=%s title=%s local_gpio=%s",
                   detail_index,
                   id(normal_device_detail_kind),
                   id(ui_presenter)->get_normal_device_entity_id(detail_index).c_str(),
                   device_title.c_str(),
                   is_local_hmi_gpio_switch_entity_id(id(ui_presenter)->get_normal_device_entity_id(detail_index))
                       ? "YES"
                       : "NO");
      - lambda: |-
          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) detail_index = 0;
          if (detail_index > 9) detail_index = 9;
          const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          if (!is_local_hmi_gpio_switch_entity_id(entity_id)) {
            return;
          }
          bool new_state = false;
          switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
            case 10:
              new_state = !id(normal_gpio_io10).state;
              if (new_state) {
                id(normal_gpio_io10).turn_on();
              } else {
                id(normal_gpio_io10).turn_off();
              }
              break;
            case 11:
              new_state = !id(normal_gpio_io11).state;
              if (new_state) {
                id(normal_gpio_io11).turn_on();
              } else {
                id(normal_gpio_io11).turn_off();
              }
              break;
            case 17:
              new_state = !id(normal_gpio_io17).state;
              if (new_state) {
                id(normal_gpio_io17).turn_on();
              } else {
                id(normal_gpio_io17).turn_off();
              }
              break;
            case 18:
              new_state = !id(normal_gpio_io18).state;
              if (new_state) {
                id(normal_gpio_io18).turn_on();
              } else {
                id(normal_gpio_io18).turn_off();
              }
              break;
            default:
              return;
          }
          id(app_storage)->set_normal_ui_device_state(detail_index, new_state);
          id(normal_device_detail_is_on) = new_state;
          id(hmi_switch_state) = new_state;
          ESP_LOGI("normal_mode", "local HMI GPIO switch toggled: index=%d entity_id=%s state=%s",
                   detail_index, entity_id.c_str(), new_state ? "ON" : "OFF");
          id(refresh_normal_switch_detail_page).execute();
      - script.execute: emit_normal_switch_or_light_control_event

  - id: emit_normal_automation_control_event
    mode: restart
    parameters:
      detail_index: int
    then:
      - if:
          condition:
            lambda: |-
              const int index = std::clamp(detail_index, 0, 9);
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(index);
              return id(normal_device_detail_active) &&
                     id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                     id(normal_device_detail_index) == index &&
                     id(normal_device_detail_online) &&
                     !id(detail_long_press_exit_fired) &&
                     entity_id.rfind("automation.", 0) == 0;
          then:
            - lambda: |-
                const int index = std::clamp(detail_index, 0, 9);
                id(normal_automation_press_feedback_active) = true;
                lv_img_set_src(id(normal_automation_detail_icon),
                               id(normal_device_automation_detail_press_img));
                ESP_LOGI("normal_mode",
                         "automation trigger requested: index=%d entity_id=%s",
                         index,
                         id(ui_presenter)->get_normal_device_entity_id(index).c_str());
            - homeassistant.service:
                service: automation.trigger
                data_template:
                  entity_id: "{{ target_entity_id }}"
                variables:
                  target_entity_id: !lambda |-
                    const int index = std::clamp(detail_index, 0, 9);
                    return id(ui_presenter)->get_normal_device_entity_id(index);
            - delay: 180ms
            - lambda: |-
                const int index = std::clamp(detail_index, 0, 9);
                id(normal_automation_press_feedback_active) = false;
                if (id(normal_device_detail_active) &&
                    id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_AUTOMATION &&
                    id(normal_device_detail_index) == index) {
                  lv_img_set_src(id(normal_automation_detail_icon),
                                 id(normal_device_automation_detail_img));
                }

  - id: emit_normal_switch_or_light_control_event
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              int detail_index = id(normal_device_detail_index);
              if (detail_index < 0) detail_index = 0;
              if (detail_index > 9) detail_index = 9;
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
              return !entity_id.empty() && entity_id.rfind("light.", 0) == 0;
          then:
            - homeassistant.service:
                service: light.toggle
                data_template:
                  entity_id: "{{ target_entity_id }}"
                variables:
                  target_entity_id: !lambda |-
                    int detail_index = id(normal_device_detail_index);
                    if (detail_index < 0) detail_index = 0;
                    if (detail_index > 9) detail_index = 9;
                    return id(ui_presenter)->get_normal_device_entity_id(detail_index);
          else:
            - if:
                condition:
                  lambda: |-
                    int detail_index = id(normal_device_detail_index);
                    if (detail_index < 0) detail_index = 0;
                    if (detail_index > 9) detail_index = 9;
                    const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
                    return !entity_id.empty() && !is_local_hmi_gpio_switch_entity_id(entity_id);
                then:
                  - homeassistant.service:
                      service: switch.toggle
                      data_template:
                        entity_id: "{{ target_entity_id }}"
                      variables:
                        target_entity_id: !lambda |-
                          int detail_index = id(normal_device_detail_index);
                          if (detail_index < 0) detail_index = 0;
                          if (detail_index > 9) detail_index = 9;
                          return id(ui_presenter)->get_normal_device_entity_id(detail_index);


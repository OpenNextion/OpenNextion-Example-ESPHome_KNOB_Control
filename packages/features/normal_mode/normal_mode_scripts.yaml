              if (!ip.is_set()) {
                continue;
              }
              char ip_buf[network::IP_ADDRESS_BUFFER_SIZE] = {0};
              ip.str_to(ip_buf);
              ip_text = std::string("IP : ") + ip_buf;
              break;

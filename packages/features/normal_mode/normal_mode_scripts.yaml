            last_trigger_text = custom_logic_entity_sub::automation_last_triggered_relative_text(
                detail_index, entity_id, now.timestamp);
          }
          lv_label_set_text(id(normal_automation_detail_action), last_trigger_text.c_str());
          lv_img_set_src(id(normal_automation_detail_icon),
                         id(normal_automation_press_feedback_active)
                             ? id(normal_device_automation_detail_press_img)
                             : id(normal_device_automation_detail_img));

          const bool is_online = (id(normal_device_online_mask) & (1 << detail_index)) != 0;
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay =
              !id(normal_wifi_connected) || !id(normal_ha_api_connected) || !is_online;
          if (show_connection_overlay) {
            lv_obj_clear_flag(id(normal_automation_detail_offline_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(normal_automation_detail_offline_overlay), LV_OBJ_FLAG_HIDDEN);

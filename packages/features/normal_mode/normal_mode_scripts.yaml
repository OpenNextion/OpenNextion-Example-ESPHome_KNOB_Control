script:
  - id: enter_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = true;
          id(sleep_wakeup_pending) = false;
      - switch.turn_on: ha_screen_off
  - id: exit_sleep_mode
    mode: restart
    then:
      - lambda: |-
          if (!id(sleep_mode_state)) {
            return;
          }
          id(sleep_mode_state) = false;
          id(sleep_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: exit_standby_mode
    mode: restart
    then:
      - lambda: |-
          id(standby_wakeup_pending) = false;
      - switch.turn_off: ha_screen_off
      - lambda: |-
          id(ui_presenter)->notify_user_activity();
  - id: refresh_normal_ha_connection_state
    mode: restart
    then:
      - lambda: |-
          const bool ha_connected =
              id(api_server)->is_connected_with_state_subscription();
          if (id(normal_ha_api_connected) == ha_connected) {
            return;
          }

          id(normal_ha_api_connected) = ha_connected;
          if (ha_connected) {
            id(normal_ha_added) = true;
          }

          if (ha_connected) {
            lv_obj_clear_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(standby_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(standby_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(ui_presenter)->is_normal_mode_active() &&
              !id(ui_presenter)->is_standby_active() &&
              id(normal_page_index) == 0 &&
              !id(normal_device_detail_active)) {
            id(show_normal_device_entry_page).execute(0);
          }
          id(refresh_normal_device_page).execute();
          id(refresh_normal_switch_detail_page).execute();
          id(refresh_normal_automation_detail_page).execute();
          id(refresh_normal_light_detail_page).execute();
          id(refresh_normal_curtain_detail_page).execute();
  - id: refresh_normal_device_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              id(normal_page_index) != 0) {
            lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 10) total = 10;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;

          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          id(normal_device_selected_index) = selected;

          struct EntryWidgets {
            lv_obj_t *icon_switch;
            lv_obj_t *icon_switch_on;
            lv_obj_t *icon_plug;
            lv_obj_t *icon_plug_on;
            lv_obj_t *icon_light;
            lv_obj_t *icon_light_on;
            lv_obj_t *icon_curtain;
            lv_obj_t *icon_settings;
            lv_obj_t *title;
            lv_obj_t *index_icon;
          };

          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          auto lower = [](std::string s) {
            for (char &c : s) {
              if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
            }
            return s;
          };

          auto device_title_at = [&](int index) -> std::string {
            const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(index);
            std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
            if (device_title.empty()) {
              device_title = device_entity_id;
            }
            return device_title;
          };

          auto device_type_at = [&](int index) -> std::string {
            return id(ui_presenter)->get_normal_device_type(index);
          };

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };

          auto render_entry = [&](EntryWidgets w, int entry_index) {
            const bool settings_entry = entry_index >= total;
            std::string device_title = settings_entry ? "Settings" : device_title_at(entry_index);
            std::string device_type = settings_entry ? "settings" : device_type_at(entry_index);

            int device_kind = 1;
            if (settings_entry) {
              device_kind = 5;
            } else {
              if (device_type.empty()) device_type = "switch";
              device_type = lower(device_type);
              if (device_type == "switch") {
                device_kind = 1;
              } else if (device_type == "plug" || device_type == "chazuo") {
                device_kind = 3;
              } else if (device_type == "light" || device_type == "liang" ||
                         device_type == "dimming_light" || device_type == "dimmable_light" || device_type == "dimming") {
                device_kind = 2;
              } else if (device_type == "curtain" || device_type == "cover") {
                device_kind = 4;
              } else if (device_type == "automation") {
                device_kind = 10;
              }
            }

            if (!settings_entry && device_title.empty()) {
              if (device_kind == 1) {
                device_title = "switch";
              } else if (device_kind == 3) {
                device_title = "plug";
              } else if (device_kind == 4) {
                device_title = "curtain";
              } else if (device_kind == 10) {
                device_title = "automation";
              } else {
                device_title = "light";
              }
            }

            set_hidden(w.icon_switch, !(device_kind == 1 || device_kind == 10));
            set_hidden(w.icon_switch_on, true);
            set_hidden(w.icon_plug, device_kind != 3);
            set_hidden(w.icon_plug_on, true);
            set_hidden(w.icon_light, !(device_kind == 2 || device_kind == 7));
            set_hidden(w.icon_light_on, true);
            set_hidden(w.icon_curtain, device_kind != 4);
            set_hidden(w.icon_settings, device_kind != 5);
            lv_img_set_src(w.icon_switch,
                           device_kind == 10 ? id(normal_device_automation_img)
                                             : id(normal_device_icon_switch_img));
            if (device_kind == 4 && !settings_entry) {
              const uint8_t curtain_position = id(app_storage)->get_normal_ui_device_position(entry_index);
              if (curtain_position >= 100) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_open_img));
              } else if (curtain_position == 0) {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_closed_img));
              } else {
                lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
              }
            } else {
              lv_img_set_src(w.icon_curtain, id(normal_device_icon_curtain_img));
            }

            if (!settings_entry && (device_kind == 1 || device_kind == 3 || device_kind == 2 || device_kind == 7)) {
              bool local_state = false;
              if (device_kind == 1 && local_hmi_gpio_switch_state(id(ui_presenter)->get_normal_device_entity_id(entry_index), &local_state)) {
                id(app_storage)->set_normal_ui_device_state(entry_index, local_state);
              }
              bool is_on = id(app_storage)->get_normal_ui_device_state(entry_index);
              if (device_kind == 1) {
                set_hidden(w.icon_switch, is_on);
                set_hidden(w.icon_switch_on, !is_on);
              } else if (device_kind == 3) {
                set_hidden(w.icon_plug, is_on);
                set_hidden(w.icon_plug_on, !is_on);
              } else {
                set_hidden(w.icon_light, is_on);
                set_hidden(w.icon_light_on, !is_on);
              }
            }

            lv_label_set_text(w.title, device_title.c_str());
            if (settings_entry) {
              set_hidden(id(normal_device_index_text), true);
              set_hidden(w.index_icon, false);
            } else {
              char index_text[16];
              snprintf(index_text, sizeof(index_text), "%d/%d", entry_index + 1, total);
              lv_label_set_text(id(normal_device_index_text), index_text);
              set_hidden(id(normal_device_index_text), false);
              set_hidden(w.index_icon, true);
            }
          };

          if (total == 0 && selected == 0) {
            set_hidden(id(normal_device_wifi_online_widget), true);
            set_hidden(id(normal_device_wifi_offline_widget), true);
            set_hidden(id(normal_device_homeassistant_online_widget), true);
            set_hidden(id(normal_device_homeassistant_offline_widget), true);
            set_hidden(id(normal_device_index_text), true);
            return;
          }
          set_hidden(id(normal_device_wifi_online_widget), !id(normal_wifi_connected));
          set_hidden(id(normal_device_wifi_offline_widget), id(normal_wifi_connected));
          set_hidden(id(normal_device_homeassistant_online_widget), !id(normal_ha_api_connected));
          set_hidden(id(normal_device_homeassistant_offline_widget), id(normal_ha_api_connected));
          if (selected >= total) {
            render_entry({id(normal_device_settings_icon_switch), id(normal_device_settings_icon_switch_on), id(normal_device_settings_icon_plug), id(normal_device_settings_icon_plug_on), id(normal_device_settings_icon_light), id(normal_device_settings_icon_light_on), id(normal_device_settings_icon_curtain), id(normal_device_settings_icon_settings), id(normal_device_settings_title), id(normal_device_settings_index_icon)}, selected);
          } else {
            switch (selected) {
              case 0:
                render_entry({id(normal_device_0_icon_switch), id(normal_device_0_icon_switch_on), id(normal_device_0_icon_plug), id(normal_device_0_icon_plug_on), id(normal_device_0_icon_light), id(normal_device_0_icon_light_on), id(normal_device_0_icon_curtain), id(normal_device_0_icon_settings), id(normal_device_0_title), id(normal_device_0_index_icon)}, 0);
                break;
              case 1:
                render_entry({id(normal_device_1_icon_switch), id(normal_device_1_icon_switch_on), id(normal_device_1_icon_plug), id(normal_device_1_icon_plug_on), id(normal_device_1_icon_light), id(normal_device_1_icon_light_on), id(normal_device_1_icon_curtain), id(normal_device_1_icon_settings), id(normal_device_1_title), id(normal_device_1_index_icon)}, 1);
                break;
              case 2:
                render_entry({id(normal_device_2_icon_switch), id(normal_device_2_icon_switch_on), id(normal_device_2_icon_plug), id(normal_device_2_icon_plug_on), id(normal_device_2_icon_light), id(normal_device_2_icon_light_on), id(normal_device_2_icon_curtain), id(normal_device_2_icon_settings), id(normal_device_2_title), id(normal_device_2_index_icon)}, 2);
                break;
              case 3:
                render_entry({id(normal_device_3_icon_switch), id(normal_device_3_icon_switch_on), id(normal_device_3_icon_plug), id(normal_device_3_icon_plug_on), id(normal_device_3_icon_light), id(normal_device_3_icon_light_on), id(normal_device_3_icon_curtain), id(normal_device_3_icon_settings), id(normal_device_3_title), id(normal_device_3_index_icon)}, 3);
                break;
              case 4:
                render_entry({id(normal_device_4_icon_switch), id(normal_device_4_icon_switch_on), id(normal_device_4_icon_plug), id(normal_device_4_icon_plug_on), id(normal_device_4_icon_light), id(normal_device_4_icon_light_on), id(normal_device_4_icon_curtain), id(normal_device_4_icon_settings), id(normal_device_4_title), id(normal_device_4_index_icon)}, 4);
                break;
              case 5:
                render_entry({id(normal_device_5_icon_switch), id(normal_device_5_icon_switch_on), id(normal_device_5_icon_plug), id(normal_device_5_icon_plug_on), id(normal_device_5_icon_light), id(normal_device_5_icon_light_on), id(normal_device_5_icon_curtain), id(normal_device_5_icon_settings), id(normal_device_5_title), id(normal_device_5_index_icon)}, 5);
                break;
              case 6:
                render_entry({id(normal_device_6_icon_switch), id(normal_device_6_icon_switch_on), id(normal_device_6_icon_plug), id(normal_device_6_icon_plug_on), id(normal_device_6_icon_light), id(normal_device_6_icon_light_on), id(normal_device_6_icon_curtain), id(normal_device_6_icon_settings), id(normal_device_6_title), id(normal_device_6_index_icon)}, 6);
                break;
              case 7:
                render_entry({id(normal_device_7_icon_switch), id(normal_device_7_icon_switch_on), id(normal_device_7_icon_plug), id(normal_device_7_icon_plug_on), id(normal_device_7_icon_light), id(normal_device_7_icon_light_on), id(normal_device_7_icon_curtain), id(normal_device_7_icon_settings), id(normal_device_7_title), id(normal_device_7_index_icon)}, 7);
                break;
              case 8:
                render_entry({id(normal_device_8_icon_switch), id(normal_device_8_icon_switch_on), id(normal_device_8_icon_plug), id(normal_device_8_icon_plug_on), id(normal_device_8_icon_light), id(normal_device_8_icon_light_on), id(normal_device_8_icon_curtain), id(normal_device_8_icon_settings), id(normal_device_8_title), id(normal_device_8_index_icon)}, 8);
                break;
              default:
                render_entry({id(normal_device_9_icon_switch), id(normal_device_9_icon_switch_on), id(normal_device_9_icon_plug), id(normal_device_9_icon_plug_on), id(normal_device_9_icon_light), id(normal_device_9_icon_light_on), id(normal_device_9_icon_curtain), id(normal_device_9_icon_settings), id(normal_device_9_title), id(normal_device_9_index_icon)}, 9);
                break;
            }
          }

  - id: show_normal_device_entry_page
    mode: restart
    parameters:
      direction: int
    then:
      - script.execute: refresh_normal_device_page
      - lambda: |-
          int total = id(normal_device_count);
          if (total < 0) total = 0;
          if (total > 10) total = 10;
          const int last_selectable = total == 0 ? (id(normal_ha_added) ? 1 : 2) : total;
          int selected = id(normal_device_selected_index);
          if (selected < 0) selected = 0;
          if (selected > last_selectable) selected = last_selectable;
          id(normal_device_selected_index) = selected;

          lv_obj_t *target = id(device_settings)->obj;
          if (total == 0 && selected == 0) {
            target = id(normal_ha_added) ? id(device_empty)->obj : id(normal_add_hmi_page)->obj;
          } else if (total == 0 && !id(normal_ha_added) && selected == 1) {
            target = id(normal_add_hmi_hello_page)->obj;
          } else if (selected < total) {
            switch (selected) {
              case 0: target = id(device_0)->obj; break;
              case 1: target = id(device_1)->obj; break;
              case 2: target = id(device_2)->obj; break;
              case 3: target = id(device_3)->obj; break;
              case 4: target = id(device_4)->obj; break;
              case 5: target = id(device_5)->obj; break;
              case 6: target = id(device_6)->obj; break;
              case 7: target = id(device_7)->obj; break;
              case 8: target = id(device_8)->obj; break;
              default: target = id(device_9)->obj; break;
            }
          }

          if (lv_scr_act() == target) {
            return;
          }
          if (direction == 0) {
            lv_scr_load(target);
            return;
          }
          lv_scr_load_anim(target,
                           direction > 0 ? LV_SCR_LOAD_ANIM_MOVE_LEFT : LV_SCR_LOAD_ANIM_MOVE_RIGHT,
                           220, 0, false);

  - id: refresh_normal_switch_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              (id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_SWITCH &&
               id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_PLUG)) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);


          int detail_index = id(normal_device_detail_index);
          if (detail_index < 0) {
            detail_index = 0;
          }
          if (detail_index > 9) {
            detail_index = 9;
          }

          const std::string device_entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);
          std::string device_title = ha_entity_title_from_registry_cache(device_entity_id);
          if (device_title.empty()) {
            device_title = device_entity_id;
          }

          auto local_hmi_gpio_switch_state = [&](const std::string &entity_id, bool *state) -> bool {
            switch (local_hmi_gpio_switch_io_from_entity_id(entity_id)) {
              case 10:
                *state = id(normal_gpio_io10).state;
                return true;
              case 11:
                *state = id(normal_gpio_io11).state;
                return true;
              case 17:
                *state = id(normal_gpio_io17).state;
                return true;
              case 18:
                *state = id(normal_gpio_io18).state;
                return true;
              default:
                return false;
            }
          };

          bool is_on = id(app_storage)->get_normal_ui_device_state(detail_index);
          const bool is_local_gpio_switch = local_hmi_gpio_switch_state(device_entity_id, &is_on);
          if (is_local_gpio_switch) {
            id(app_storage)->set_normal_ui_device_state(detail_index, is_on);
          }
          id(normal_device_detail_is_on) = is_on;
          std::string state_text = is_on ? "ON" : "OFF";

          lv_obj_t *page = id(normal_switch_page)->obj;
          lv_obj_t *shell = id(normal_switch_detail_shell);
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          if (is_on) {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x54524F), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_title), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_set_style_bg_color(page, lv_color_hex(0x272727), 0);
            lv_obj_set_style_bg_color(shell, lv_color_hex(0x272727), 0);
            lv_obj_set_style_border_width(shell, 0, 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_state), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(normal_switch_detail_title), lv_color_hex(0xD2D2D2), 0);
          }
          if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_SWITCH) {
            set_hidden(id(normal_device_detail_plug_on), true);
            set_hidden(id(normal_device_detail_plug_off), true);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), !is_on);
            set_hidden(id(normal_device_detail_switch_off), is_on);
          } else if (id(normal_device_detail_kind) == NORMAL_DEVICE_DETAIL_KIND_PLUG) {
            set_hidden(id(normal_device_detail_plug_on), !is_on);
            set_hidden(id(normal_device_detail_plug_off), is_on);
            set_hidden(id(normal_device_detail_light_on), true);
            set_hidden(id(normal_device_detail_light_off), true);
            set_hidden(id(normal_device_detail_switch_on), true);
            set_hidden(id(normal_device_detail_switch_off), true);
          }

          lv_label_set_text(id(normal_switch_detail_state), state_text.c_str());
          lv_label_set_text(id(normal_switch_detail_title), device_title.c_str());
          lv_obj_t *sw = id(hmi_gui_switch);
          if (is_on) {
            lv_obj_add_state(sw, LV_STATE_CHECKED);
          } else {
            lv_obj_clear_state(sw, LV_STATE_CHECKED);
          }
          const bool is_online = is_local_gpio_switch ||
                                 ((detail_index >= 0 && detail_index < 10)
                                      ? ((id(normal_device_online_mask) & (1 << detail_index)) != 0)
                                      : true);
          id(normal_device_detail_online) = is_online;
          const bool show_connection_overlay = !is_local_gpio_switch &&
                                               (!id(normal_wifi_connected) ||
                                               !id(normal_ha_api_connected) ||
                                               !is_online);
          set_hidden(id(normal_switch_detail_offline_overlay), !show_connection_overlay);
          const char *offline_text = !id(normal_wifi_connected)
                                         ? "WiFi disconnected"
                                         : (!id(normal_ha_api_connected) ? "Home Assistant\ndisconnected" : "Device Offline");
          lv_label_set_text(id(normal_switch_detail_offline_text), offline_text);

  - id: refresh_normal_automation_detail_page
    mode: restart
    then:
      - lambda: |-
          if (!id(ui_presenter)->is_normal_mode_active() ||
              id(ui_presenter)->is_standby_active() ||
              !id(normal_device_detail_active) ||
              id(normal_device_detail_kind) != NORMAL_DEVICE_DETAIL_KIND_AUTOMATION) {
            return;
          }

          lv_obj_add_flag(id(normal_device_wifi_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_wifi_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_online_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_homeassistant_offline_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(normal_device_index_text), LV_OBJ_FLAG_HIDDEN);

          int detail_index = std::clamp(id(normal_device_detail_index), 0, 9);
          const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(detail_index);

# Normal mode feature package.
# Handles the default customer UI behavior.

json:

number:
  - platform: template
    name: "1. Standby timeout"
    id: standby_timeout_seconds
    icon: "mdi:sleep"
    optimistic: true
    restore_value: true
    entity_category: config
    initial_value: 300
    min_value: 1
    max_value: 900
    step: 1
    on_value:
      then:
        - lambda: |-
            int timeout_seconds = (int) x;
            if (timeout_seconds < 1) {
              timeout_seconds = 1;
            }
            if (timeout_seconds > 900) {
              timeout_seconds = 900;
            }
            id(ui_presenter)->set_standby_timeout_ms((uint32_t) timeout_seconds * 1000U);
  - platform: template
    name: "5. Sleep timeout"
    id: sleep_timeout_seconds
    icon: "mdi:timer-sand"
    optimistic: true
    restore_value: false
    entity_category: config
    initial_value: 60
    min_value: 1
    max_value: 3600
    step: 1
    on_value:
      then:
        - lambda: |-
            int timeout_seconds = (int) x;
            if (timeout_seconds < 1) {
              timeout_seconds = 1;
            }
            if (timeout_seconds > 3600) {
              timeout_seconds = 3600;
            }
            id(ui_presenter)->set_sleep_mode_config(
                id(sleep_mode_enabled).state,
                id(sleep_mode_start_time).state,
                id(sleep_mode_end_time).state,
                (uint32_t) timeout_seconds * 1000U);

text:
  - platform: template
    name: "3. Sleep start time"
    id: sleep_mode_start_time
    icon: "mdi:bed-clock"
    optimistic: false
    restore_value: false
    entity_category: config
    mode: text
    initial_value: "23:00:00"
    set_action:
      - lambda: |-
          bool valid =
              x.length() == 8 &&
              x[2] == ':' &&
              x[5] == ':' &&
              x[0] >= '0' && x[0] <= '2' &&
              x[1] >= '0' && x[1] <= '9' &&
              x[3] >= '0' && x[3] <= '5' &&
              x[4] >= '0' && x[4] <= '9' &&
              x[6] >= '0' && x[6] <= '5' &&
              x[7] >= '0' && x[7] <= '9';

          if (valid) {
            int hour   = (x[0] - '0') * 10 + (x[1] - '0');
            int minute = (x[3] - '0') * 10 + (x[4] - '0');
            int second = (x[6] - '0') * 10 + (x[7] - '0');

            valid = hour <= 23 && minute <= 59 && second <= 59;
          }

          if (valid) {
            id(ui_presenter)->set_sleep_mode_config(
              id(sleep_mode_enabled).state,
              x,
              id(sleep_mode_end_time).state,
              (uint32_t) id(sleep_timeout_seconds).state * 1000U);
            id(sleep_mode_start_time).publish_state(x);
          } else {
            ESP_LOGW("time_setting", "Invalid time: %s", x.c_str());
          }
          

  - platform: template
    name: "4. Sleep end time"
    id: sleep_mode_end_time
    icon: "mdi:bed-clock"
    optimistic: false
    restore_value: false
    entity_category: config
    mode: text
    initial_value: "07:00:00"
    set_action:
      - lambda: |-
          bool valid =
              x.length() == 8 &&
              x[2] == ':' &&
              x[5] == ':' &&
              x[0] >= '0' && x[0] <= '2' &&

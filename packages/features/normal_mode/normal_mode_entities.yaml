              x[3] >= '0' && x[3] <= '5' &&
              x[4] >= '0' && x[4] <= '9' &&
              x[6] >= '0' && x[6] <= '5' &&
              x[7] >= '0' && x[7] <= '9';

          if (valid) {
            int hour   = (x[0] - '0') * 10 + (x[1] - '0');
            int minute = (x[3] - '0') * 10 + (x[4] - '0');
            int second = (x[6] - '0') * 10 + (x[7] - '0');

            valid = hour <= 23 && minute <= 59 && second <= 59;
          }

          if (valid) {
            id(ui_presenter)->set_sleep_mode_config(
              id(sleep_mode_enabled).state,
              id(sleep_mode_start_time).state,
              x,
              (uint32_t) id(sleep_timeout_seconds).state * 1000U);
            id(sleep_mode_end_time).publish_state(x);
          } else {
            ESP_LOGW("time_setting", "Invalid time: %s", x.c_str());
          }

  - platform: template
    name: "6. HA host"
    id: ha_host
    icon: "mdi:home-account"
    optimistic: true
    restore_value: true
    entity_category: config
    mode: text
    initial_value: "homeassistant.local"

  - platform: template
    name: "7. HA token"
    id: ha_token
    icon: "mdi:lock"
    min_length: 0
    max_length: 255
    mode: text
    initial_value: ""
    restore_value: false
    optimistic: false
    entity_category: config
    set_action:
      - lambda: |-
          save_ha_token_value(x);
          id(ha_token).publish_state("");
          id(ha_token_status).update();

button:
  - platform: template
    name: "8. Refresh Entity List"
    id: fetch_entities_btn
    entity_category: config
    on_press:
      - lambda: |-
          if (id(ha_host).state.empty()) {
            id(ha_host).publish_state("homeassistant.local");
          }
          request_ha_entity_list_over_websocket(id(ha_host).state,
                                                id(device1_config), id(device2_config),
                                                id(device3_config), id(device4_config), id(device5_config),
                                                id(device6_config), id(device7_config), id(device8_config),
                                                id(device9_config), id(device10_config),
                                                id(standby_weather_config),
                                                id(api_server));
          id(ha_token_status).update();
  - platform: template
    name: "20. Save Entity Config"
    id: save_entity_config_btn
    entity_category: config
    on_press:
      - lambda: |-
          const bool entity_changed = save_entity_config_from_selects(id(device1_config), id(device2_config),
                                                                      id(device3_config), id(device4_config),
                                                                      id(device5_config), id(device6_config),
                                                                      id(device7_config), id(device8_config),
                                                                      id(device9_config), id(device10_config),
                                                                      id(standby_weather_config));
          auto count_configured_device = [](esphome::select::Select *select) -> int {
            if (select == nullptr) {
              return 0;
            }
            const std::string entity_id = extract_entity_id_from_device1_option(select->state);
            return !entity_id.empty() && is_supported_normal_device_entity_id(entity_id.c_str()) ? 1 : 0;
          };
          const int configured_device_count =
              count_configured_device(id(device1_config)) +
              count_configured_device(id(device2_config)) +
              count_configured_device(id(device3_config)) +
              count_configured_device(id(device4_config)) +
              count_configured_device(id(device5_config)) +
              count_configured_device(id(device6_config)) +
              count_configured_device(id(device7_config)) +
              count_configured_device(id(device8_config)) +
              count_configured_device(id(device9_config)) +
              count_configured_device(id(device10_config));
          id(normal_device_count) = configured_device_count;
          const int last_selectable = configured_device_count == 0 ? (id(normal_ha_added) ? 1 : 2) : configured_device_count;
          if (id(normal_device_selected_index) > last_selectable) {
            id(normal_device_selected_index) = last_selectable;
          }
          if (id(normal_device_selected_index) < 0) {
            id(normal_device_selected_index) = 0;
          }
          subscribe_device_config_entities_from_selects(id(device1_config), id(device2_config),
                                                        id(device3_config), id(device4_config), id(device5_config),
                                                        id(device6_config), id(device7_config), id(device8_config),
                                                        id(device9_config), id(device10_config),
                                                        id(standby_weather_config), id(api_server),
                                                        &id(standby_weather_entity_id),
                                                        &id(standby_weather_state),
                                                        &id(standby_weather_temperature),
                                                        &id(standby_weather_temperature_unit),
                                                        &id(standby_weather_humidity));
          if (entity_changed) {
            custom_logic::disconnect_all_clients_for_refresh(id(api_server));
          }
          apply_device1_type_options(id(device1_type));
          apply_device2_type_options(id(device2_type));
          apply_device3_type_options(id(device3_type));
          apply_device4_type_options(id(device4_type));
          apply_device5_type_options(id(device5_type));
          apply_device6_type_options(id(device6_type));
          apply_device7_type_options(id(device7_type));
          apply_device8_type_options(id(device8_type));
          apply_device9_type_options(id(device9_type));
          apply_device10_type_options(id(device10_type));
      - if:
          condition:
            lambda: |-
              return id(ui_presenter)->is_normal_mode_active() &&
                     !id(ui_presenter)->is_standby_active() &&
                     id(normal_page_index) == 0;
          then:
            - script.execute:
                id: show_normal_device_entry_page
                direction: 0
      - if:
          condition:
            lambda: |-
              const std::string entity_id = extract_entity_id_from_device1_option(id(device1_config).state);
              return has_saved_ha_token() && entity_id.rfind("light.", 0) == 0;
          then:
            - http_request.get:
                url: !lambda |-
                  return build_ha_http_state_url(id(ha_host).state, extract_entity_id_from_device1_option(id(device1_config).state));
                capture_response: true
                max_response_buffer_size: 64kB
                request_headers:
                  Authorization: !lambda |-
                    return get_ha_authorization_header();
                  Content-Type: "application/json"
                on_response:
                  then:
                    - lambda: |-
                        if (update_device1_light_config_from_http_response(
                                extract_entity_id_from_device1_option(id(device1_config).state), body)) {
                          apply_device1_type_options(id(device1_type));
                        }
                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGE("HA_API", "Fetch device1 light state request failed");

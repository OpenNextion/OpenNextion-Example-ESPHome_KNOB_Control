    on_turn_off:
      then:
        - lambda: |-
            for (int i = 0; i < 10; i++) {
              const std::string entity_id = id(ui_presenter)->get_normal_device_entity_id(i);
              if (local_hmi_gpio_switch_io_from_entity_id(entity_id) == 18) {
                id(app_storage)->set_normal_ui_device_state(i, false);
              }
            }
            if (id(normal_device_detail_active)) id(refresh_normal_switch_detail_page).execute();
  - platform: template
    name: "Screen Off"
    id: ha_screen_off
    internal: true
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            if(id(boot_finished)) {
              id(screen_off_state) = true;
              auto call = id(lcd_backlight)->make_call();
              call.set_brightness(0.0f);
              call.set_state(false);
              call.perform();
              id(ha_display_light_syncing) = true;
              auto ha_call = id(ha_light)->make_call();
              ha_call.set_state(false);
              ha_call.perform();
              id(ha_display_light_syncing) = false;
            }
    on_turn_off:
      then:
        - lambda: |-
            if(id(boot_finished)) {
              id(screen_off_state) = false;
              auto call = id(lcd_backlight)->make_call();
              int pct = id(normal_brightness_value);
              if (pct < 10) pct = 10;
              if (pct > 100) pct = 100;
              id(normal_brightness_value) = pct;
              call.set_brightness((float)pct / 100.0f);
              call.set_state(true);
              call.perform();
              id(ha_display_light_syncing) = true;
              auto ha_call = id(ha_light)->make_call();
              ha_call.set_state(true);
              ha_call.set_brightness((float)pct / 100.0f);
              ha_call.perform();
              id(ha_display_light_syncing) = false;
            }
  - platform: template
    name: "2. Sleep mode enabled"
    id: sleep_mode_enabled
    icon: "mdi:sleep"
    optimistic: true
    restore_mode: DISABLED
    entity_category: config
    turn_on_action:
      - lambda: |-
          id(ui_presenter)->set_sleep_mode_config(
              true,
              id(sleep_mode_start_time).state,
              id(sleep_mode_end_time).state,
              (uint32_t) id(sleep_timeout_seconds).state * 1000U);
    turn_off_action:
      - lambda: |-
          id(ui_presenter)->set_sleep_mode_config(
              false,
              id(sleep_mode_start_time).state,
              id(sleep_mode_end_time).state,
              (uint32_t) id(sleep_timeout_seconds).state * 1000U);

output:
  - platform: template
    type: float
    id: ha_light_output
    write_action:
      - lambda: |-
          if (!id(boot_finished) || id(ha_display_light_syncing)) {
            return;
          }
          if (state <= 0.0f) {
            id(ha_screen_off).turn_on();
            return;
          }
          const bool wake_from_sleep = id(sleep_mode_state);
          const bool wake_from_standby = !wake_from_sleep && id(ui_presenter)->is_standby_active();
          if (wake_from_sleep || wake_from_standby) {
            id(sleep_mode_state) = false;
            id(sleep_wakeup_pending) = false;
            id(standby_wakeup_pending) = false;
            id(standby_input_suppressed_until_ms) = 0;
            id(ui_presenter)->notify_user_activity();
            ESP_LOGI("normal_mode", "screen light control woke display: source=%s",
                     wake_from_sleep ? "sleep" : "standby");
          }
          int pct = (int) roundf(state * 100.0f);
          if (pct < 10) pct = 10;
          if (pct > 100) pct = 100;
          id(normal_brightness_value) = pct;
          id(screen_off_state) = false;
          if (id(ha_screen_off).state) {
            id(ha_screen_off).turn_off();
            return;
          }
          auto call = id(lcd_backlight)->make_call();
          call.set_brightness((float)pct / 100.0f);
          call.set_state(true);
          call.perform();

light:
  - platform: monochromatic
    name: "Screen Light"
    id: ha_light
    output: ha_light_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    flash_transition_length: 0s
    gamma_correct: 1.0


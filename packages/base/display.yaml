spi:
  id: bus_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1

output:
  - platform: ledc
    id: lcd_backlight_pwm
    pin: GPIO6
    frequency: 10000Hz

light:
  - platform: monochromatic
    id: lcd_backlight
    output: lcd_backlight_pwm
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    flash_transition_length: 0s
    internal: true

# Font paths are relative to the main ESPHome config directory.
